<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8<!-- Tell phones to render at real device width, no weird zooming -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Home-screen app mode: opens fullscreen, no browser address bar -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pomodoro">
<!-- Match the phone's UI to our theme -->
<meta name="theme-color" content="#141210">

<!-- App icon, drawn in code: orange square with a tomato -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23141210'/%3E%3Ccircle cx='50' cy='58' r='28' fill='%23d97757'/%3E%3Cpath d='M50 30 q-3 -10 8 -14 q-1 8 -8 14 z' fill='%23d97757'/%3E%3Cpath d='M38 26 q12 -6 24 0 l-5 8 q-7 -3 -14 0 z' fill='%23d97757'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23141210'/%3E%3Ccircle cx='50' cy='58' r='28' fill='%23d97757'/%3E%3Cpath d='M50 30 q-3 -10 8 -14 q-1 8 -8 14 z' fill='%23d97757'/%3E%3Cpath d='M38 26 q12 -6 24 0 l-5 8 q-7 -3 -14 0 z' fill='%23d97757'/%3E%3C/svg%3E">

<title>Pomodoro + Stopwatch</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: #141210; color: #e8e0d5;
    font-family: 'Segoe UI', system-ui, sans-serif;
  }
  h1 { font-weight: 300; letter-spacing: 5px; color: #d97757; margin-bottom: 10px; }

  .modes { display: flex; gap: 20px; margin: 18px 0 14px; }
  .mode {
    padding: 10px 24px; border-radius: 20px; cursor: pointer;
    background: #26221e; color: #d97757;
    font-size: 16px; font-weight: 500;
    transition: background 0.15s, color 0.15s;
  }
  .mode.active { background: #d97757; color: #141210; }

  .settings {
    display: flex; gap: 22px; align-items: center;
    margin-bottom: 20px; color: #7a7065; font-size: 14px;
    flex-wrap: wrap; justify-content: center;
  }
  .setting { display: flex; align-items: center; gap: 6px; }
  .setting input {
    width: 52px; background: #26221e; border: 1px solid #3a332c;
    border-radius: 8px; color: #d97757; font-size: 16px;
    font-weight: 600; padding: 6px 4px; text-align: center;
    -moz-appearance: textfield;
  }
  .setting input::-webkit-outer-spin-button,
  .setting input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .setting input:focus { outline: none; border-color: #d97757; }

  .ring-wrap { position: relative; width: 260px; height: 260px; }
  .ring-wrap.flash { animation: flash 0.5s ease-in-out 4; }
  @keyframes flash {
    50% { filter: drop-shadow(0 0 22px #d97757); }
  }
  svg { transform: rotate(-90deg); display: block; }
  .track { fill: none; stroke: #d97757; stroke-width: 2; opacity: 0.45; }
  .fill {
    fill: none; stroke: #d97757; stroke-width: 12;
    stroke-linecap: butt; transition: stroke-dashoffset 0.5s linear;
  }
  #time {
    position: absolute;: 46%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 46px; font-variant-numeric: tabular-nums;
    color: #d97757;
  }
  #phase {
    position: absolute; top: 66%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 14px; letter-spacing: 3px; color: #7a7065;
  }

  .controls { display: flex; gap: 24px; margin-top: 34px; }
  button {
    background: #d97757; color: #141210; border: none;
    padding: 14px 44px; border-radius: 26px; font-size: 18px;
    font-weight: 600; cursor: pointer;
    transition: transform 0.15s, background 0.15s;
  }
  button:hover { background: #e2907a; transform: scale(1.05); }
  button.secondary { background: #26221e; color: #d97757; }
  button.secondary:hover { background: #362f28; transform: scale(1.05); }

  /* Session counter as a button — styled like the secondary buttons
     so the family resemblance is obvious. */
  .session-btn {
    background: #26221e; color: #d97757;
    border: 1px solid #3a332c; border-radius: 26px;
    padding: 12px 32px; margin-top: 26px;
    font-family: inherit; font-size: 16px; font-weight: 500;
    letter-spacing: 0.5px; cursor: pointer; user-select: none;
    transition: background 0.15s, transform 0.15s;
  }
  .session-btn:hover { background: #362f28; transform: scale(1.05); }
  .session-btn .num { font-weight: 700; font-size: 19px; }

  #laps {
    color: #7a7065; font-size: 15px; max-height: 130px;
    overflow-y: auto; text-align: center; margin-top: 8px;
  }
  #laps div { padding: 3px 0; }
  #laps .split { color: #d97757; font-weight: 600; }

  /* Small screens: nudge things inward so nothing touches the edges */
  @media (max-width: 340px) {
    .modes { gap: 10px; }
    .controls { gap 14px; }
  }
</style>
</head>
<body>
  <h1>POMODORO</h1>
  <div class="modes">
    <span class="mode active" id="tab-focus" onclick="setMode('focus')">Focus</span>
    <span class="mode" id="tab-break" onclick="setMode('break')">Break</span>
    <span class="mode" id="tab-stopwatch" onclick="setMode('stopwatch')">Stopwatch</span>
  </div>
  <div class="settings">
    <div class="setting">
      <label for="focusMin">Focus</label>
      <input type="number" id="focusMin" min="0" max="180" value="25"> min
      <input type="number" id="focusSec" min="0" max="59" value="0"> sec
    </div>
     class="setting">
      <label for="breakMin">Break</label>
      <input type="number" id="breakMin" min="0" max="60" value="5"> min
      <input type="number" id="breakSec" min="0 max="59" value="0"> sec
    </div>
  </div>
  <div class="ring-wrap" id="ringwrap">
    <svg width="260" height="260">
      <circle class="track" cx="130" cy="130" r="118"/>
      <circle class="track" cx="130" cy="130" r="106"/>
      <circle class="fill" id="fill" cx="130" cy="130" r="112"/>
    </svg>
    <div id="time">25:00</div>
    <div id="phase">FOCUS</div>
  </div>
  <div class="controls">
    <button id="btn" onclick="toggle()">Start</button>
    <button id="lapbtn" class="secondary" style="display:none" onclick="recordLap()">Lap</button>
    <button id="resetbtn" class="secondary" style="display:none" onclick="resetStopwatch()">Reset</button>
  </div>
  <div class="session-btn" id="session" onclick="resetSessions()"
       title="Click to reset session count">
    Sessions completed: <span class="num" id="count">0</span>
  </div>
  <div id="laps"></div>

<script>
  var R_FILL = 112;
  var LEN_FILL = 2 * Math.PI * R_FILL;
  var fill = document.getElementById('fill');
  fill.style.strokeDasharray = LEN_FILL;

  var mode = 'focus';                     // 'focus' | 'break' | 'stopwatch'
  var focusSecs = 25 * 60;
  var breakSecs = 5 * 60;
  var total = focusSecs, remaining = total, timer = null;
  var sessions = 0, laps = 0;
  var phaseFresh = true;                  // true = next Start (re)begins the phase from full time
  var stopwatchStart = null;
  stopwatchElapsed = 0;
  var lastLapMs = 0;

  function secsFromInputs(prefix) {
    var m = parseInt(document.getElementById(prefix + 'Min').value, 10) || 0;
    var s = parseInt(document.getElementById(prefix + 'Sec').value, 10) || 0;
    return m * 60 + s;
  }

  function splitToInputs(prefix, secs) {
    document.getElementById(prefix + 'Min').value = Math.floor(secs / 60);
    document.getElementById(prefix + 'Sec').value = secs % 60;
  }

  // ---- load saved state (durations + session count), then wire inputs ----
  (function loadDurations() {
    try {
      var f = parseInt(localStorage.getItem('pomo_focus_sec'), 10);
      var b = parseInt(localStorage.getItem('pomo_break_sec'), 10);
      // NOTE: we deliberately keep the "> 0" check here (unlike applyDurations,
      // which now allows 0). If a saved 0 were loaded on refresh, a user who
      // zeroed both fields would come back to a dead, silent timer with no
      // explanation. Falling back to defaults on reload is the friendlier
      // failure mode; the 0 they saved only affects the visit.
      if (f > 0) focusSecs = f;
      if (b > 0) breakSecs = b;

      // Session count: unlike durations, a saved 0 is meaningful here
      // (the user completed sprints, then reset). So we accept any saved
      // number >= 0; only "nothing saved at all" keeps the default of 0.
      var savedSessions parseInt(localStorage.getItem('pomo_sessions'), 10);
      if (!isNaN(savedSessions) && savedSessions >= 0) sessions = savedSessions;
    } catch (e) { /* localStorage unavailable — keep defaults */ }
    splitToInputs('focus', focusSecs);
    splitToInputs('break', breakSecs);
    document.getElementById('count').textContent = sessions;
    ['focusMin', 'focusSec', 'breakMin', 'breakSec'].forEach(function (id) {
      document.getElementById(id).addEventListener('change', applyDurations);
    });
  })();

  // Central place to update the counter: touches the screen AND storage,
  // so they can never drift apart.
  function setSessions(n) {
    sessions = n;
    document.getElementById('count').textContent = sessions;
    try { localStorage.setItem('pomo_sessions', sessions); } catch (e) {}
  }

  // Edits apply IMMEDIATELY — including to a phase that is currently running
  // (that phase restarts with the new duration). 0 is now a legal value and
  // meansskip this phase".
  function applyDurations() {
    var f = secsFromInputs('focus');
    var b = secsFromInputs('break');
    if (f >= 0 && f <= 180 * 60) {
      focusSecs = f;
      try { localStorage.setItem('pomo_focus_sec', f); } catch (e) {}
    }
    if (b >= 0 && b <= 60 * 60) {
      breakSecs = b;
      try { localStorage.setItem('pomo_break', b); } catch (e) {}
    }
    splitToInputs('focus', focusSecs);   // echo back sanitized values
    splitToInputs('break', breakSecs);

    if (mode !== 'stopwatch') {
      total = (mode === 'focus') ? focusSecs : breakSecs;
      remaining = total;
      phaseFresh = true;                 // an edit restarts the phase from full
      if (timer && total === 0) {
        // The running phase was just set to 0: skip ahead immediately
        // (or stop cleanly if nothing is left to run).
        clearInterval(timer);
        timer = null;
        advancePhase();
      } else {
        render();
      }
    }
  }

  // Find the next phase to run after `from`. Skips zero-length phases.
  // Returns 'focus'/'break', or null if BOTH durations are 0.
 function nextPhase(from) {
    if (from === 'focus' && breakSecs > 0) return 'break';
    if (from === 'break' && focusSecs > 0) return 'focus';
    if (from === 'focus' && focusSecs > 0) return 'focus'; // break is 0: chain sprints
    if (from === 'break' && breakSecs > 0) return 'break'; // focus is 0: chain breaks
    return null;
  }

  // Called when a phase finishes. Advances to the next runnable phase,
  // or stops the timer cleanly if both durations are 0.
  function advancePhase() {
    var finished = mode;
    var next = nextPhase(finished);

    if (finished === 'focus') {
      setSessions(sessions + 1);     // counts FOCUS completions only
    }

    if (next === null) {
      // Both phases are 0 — stop instead of looping/chime-spamming forever.
      document.getElementById('btn').textContent = 'Start';
      return;
    }

    mode = next;
    total = (mode === 'focus') ? focusSecs : breakSecs;
    remaining = total;
    phaseFresh = false;              // new phase starts immediately, not on next Start
    setTab(mode);
    setPhaseLabel(mode);
    render();
    startInterval(1000);
  }

  // Click the "Sessions completed" button to zero the counter.
  // The zero is now saved too, so it survives refresh and close.
  function resetSessions() {
    if (sessions === 0) return;   // nothing to reset — no nagging dialog
    var ok confirm('Reset session count to zero?');
    if (ok) setSessions(0);
  }

  function setFill(fraction) {
    fraction = Math.max(0, Math.min(1, fraction));
    fill.style.strokeDashoffset = LEN_FILL * (1 - fraction);
  }

  function startInterval(ms) {
    if (timer) clearInterval(timer);
    timer = setInterval(tick, ms);
  }

  function setPhaseLabel(name) {
    document.getElementById('phase').textContent =
      (name === 'focus') ? 'FOCUS' : 'BREAK';
  }

  function setTab(name) {
    ['focus', 'break', 'stopwatch'].forEach(function (m) {
      document.getElementById('tab-' + m).classList.toggle('active', m === name);
    });
    var isStopwatch = (name === 'stopwatch');
    document.getElementById('lapbtn').style.display = isStopwatch ? 'inline-block' : 'none';
    document.getElementById('resetbtn').style.display = isStopwatch ? 'inline-block' : 'none';
    document.getElementById('phase').style.display = isStopwatch ? 'none' : 'block';
  }

  function setMode(name) {
    var wasRunning = !!timer;
    if (timer) { clearInterval(timer); timer = null; }
 mode = name;
    setTab(name);
    if (mode === 'stopwatch') {
      resetStopwatch();
      setFill(0);
      if (wasRunning) {
        stopwatchStart = Date.now();
        startInterval(250);
        document.getElementById('btn').textContent = 'Pause';
      }
    } else {
      laps = 0;
      document.getElementById('laps').innerHTML = '';
      total = (mode === 'focus') ? focusSecs : breakSecs;
      remaining = total;
      phaseFresh = true;             // switching tabs always starts a clean phase
      setPhaseLabel(mode);
      setFill(0);
      render();
      if (wasRunning) {
        startInterval(1000);
        document.getElementById('btn').textContent = 'Pause';
      }
    }
  }

  function toggle() {
    if (timer) {
      if (mode === 'stopwatch') stopwatchElapsed += Date.now() - stopwatchStart;
      clearInterval(timer); timer = null;
      document.getElementById('btn').textContent = 'Start';
      // phaseFresh stays false → next Start resumes, doesn't restart
    } else {
      if (mode !== 'stopwatch') {
        // Fresh phase: jump over a zero-duration current phase, reset the clock.
        // Paused mid-phase: resume from where we left off.
        if (phaseFresh) {
          var curSecs = (mode === 'focus') ? focusSecs : breakSecs;
          if (curSecs === 0) {
            var target = nextPhase(mode);
            if (target === null) return;  // both 0 — nothing to run
            if (target !== mode) {
              mode = target;
              setTab(mode);
              setPhaseLabel(mode);
            }
          }
          total = (mode === 'focus') ? focusSecs : breakSecs;
          remaining = total;
          setFill(0);
          phaseFresh = false;
          render();
        }
        // else: resuming — keep total/remaining/fill exactly as they were
      }
      if (mode === 'stopwatch') stopwatchStart = Date.now();
      startInterval(mode === 'stopwatch' ? 250 : 1000);
      document.getElementById('btn').textContent = 'Pause';
    }
  }

  function resetStopwatch() {
    if (timer) { clearInterval(timer); timer = null; }
    stopwatchStart = null;
    stopwatchElapsed = 0;
    lastLapMs = 0;
    laps = 0;
    document.getElementById('laps').innerHTML = '';
    document.getElementById('time').textContent = '00:00.00';
    document.getElementById('btn').textContent = 'Start';
  }

  function tick() {
    if (mode === 'stopwatch') {
      renderStopwatch();
      return;
    }
    remaining--;
    render();
    if (remaining <= 0) {
      clearInterval(timer);
      timer = null;
      notifyDone();
      advancePhase();
    }
  }

  function render() {
    var m = String(Math.floor(remaining / 60)).padStart(2, '0');
    var s = String(remaining % 60).padStart(2, '0');
    document.getElementById('time').textContent = m + ':' + s;
    setFill(total > 0 ? ( - remaining) / total : 0);
  }

  function getStopwatchMs() {
    var ms = stopwatchElapsed;
    if (timer) ms += Date.now() - stopwatchStart;
    return ms;
  }

  function formatMs(ms) {
    var cs = Math.floor(ms / 10) % 100;
    var s = Math.floor(ms / 1000) % 60;
    var m = Math.floor(ms / 60000);
    return String(m).padStart(2, '0') + ':' +
           String(s).padStart(2, '0') + '.' +
           String(cs).padStart(2, '0');
  }

  function renderStopwatch() {
    document.getElementById('time').textContent = formatMs(getStopwatchMs());
  }

  function recordLap() {
    var nowMs = getStopwatchMs();
    var splitMs = nowMs - lastLapMs;
    lastLapMs = nowMs;
    laps++;
    var row = document.createElement('div');
    row.innerHTML = 'Lap ' + laps + ': <span class="split">' + formatMs(splitMs) +
                    '</span> &nbsp;(at ' + formatMs(nowMs) + ')';
    document.getElementById('laps').prepend(row);
  }

  function notifyDone() {
    document.getElementById('ringwrap').classList.add('flash');
    setTimeout(function () {
      document.getElementById('ringwrap').classList.remove('flash');
    }, 2100);
    try {
      var ctx = new (window.AudioContext || window.webkitAudioContext)();
      [660, 880].forEach(function (freq, i) {
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.frequency.value = freq;
        osc.type = 'sine';
        osc.connect(gain);
        gain.connect(ctx.destination);
        var t = ctx.currentTime + i * 0.25;
        gain.gain.setValueAtTime(0.2, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
        osc.start(t);
        osc.stop(t + 0.4);
      });
    } catch (e) { /* audio not available — flash is enough */ }
  }

  setMode('focus');
</script>
</body>
</html>
